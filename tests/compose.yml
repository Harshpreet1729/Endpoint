# Isolated end-to-end test stack. No production credentials or external receivers.
x-app: &app
  build:
    context: ..
  environment: &environment
    DEBUG: "True"
    ALLOWED_HOSTS: web,localhost,127.0.0.1
    DATABASE_URL: postgresql+psycopg://eventgate:test-only-password@postgres:5432/eventgate
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/0
    ALLOW_PRIVATE_WEBHOOKS: "True"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: eventgate
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: eventgate
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventgate"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
  web:
    <<: *app
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:18081:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 2s
      timeout: 3s
      retries: 30
  worker:
    <<: *app
    command: celery -A app.celery_app:celery_app worker --beat --loglevel=info --concurrency=2 --schedule=/tmp/eventgate-beat
    depends_on:
      web:
        condition: service_healthy
  receiver:
    <<: *app
    command: python /tests/receiver.py
    volumes:
      - .:/tests:ro
  smoke:
    <<: *app
    profiles: ["test"]
    command: python /tests/smoke.py
    volumes:
      - .:/tests:ro
    depends_on:
      web:
        condition: service_healthy
      worker:
        condition: service_started
      receiver:
        condition: service_started
